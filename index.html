<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPRINT CRM</title>
<meta name="description" content="MPRINT — мижозлар, заказлар, дизайн ва нарх">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141832">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MPRINT CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--k:#141832;--c:#00A8E8;--m:#E6007E;--y:#FFC400;--cmyk:linear-gradient(90deg,#00A8E8,#E6007E,#FFC400)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--k);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  .hidden{display:none!important}

  /* Сайт — бутун экран бўйлаб */
  #ilova{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#F3F5FB;opacity:0;transition:opacity .4s}
  #ilova.tayyor{opacity:1}

  /* Юкланиш экрани */
  .splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;color:#fff;text-align:center;
    background:radial-gradient(520px 380px at 15% 10%,rgba(0,168,232,.22),transparent 60%),radial-gradient(520px 380px at 90% 95%,rgba(230,0,126,.20),transparent 60%),var(--k);transition:opacity .45s}
  .splash.ket{opacity:0;pointer-events:none}
  .logo{width:132px;height:132px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));animation:lgo 3.2s cubic-bezier(.5,0,.25,1) infinite}
  @keyframes lgo{0%{transform:rotate(0) scale(1)}35%{transform:rotate(360deg) scale(1)}50%{transform:rotate(360deg) scale(.86)}62%{transform:rotate(360deg) scale(1.06)}72%,100%{transform:rotate(360deg) scale(1)}}
  .wm{font-weight:800;font-size:30px;letter-spacing:.06em;line-height:1}
  .wm span{background:var(--cmyk);-webkit-background-clip:text;background-clip:text;color:transparent}
  .dots{display:flex;gap:8px}
  .dots i{width:10px;height:10px;border-radius:50%;animation:nuq 1.2s ease-in-out infinite}
  .dots i:nth-child(1){background:var(--c)} .dots i:nth-child(2){background:var(--m);animation-delay:.15s}
  .dots i:nth-child(3){background:var(--y);animation-delay:.3s} .dots i:nth-child(4){background:#fff;animation-delay:.45s}
  @keyframes nuq{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
  .msg{font-size:15px;font-weight:600;color:rgba(255,255,255,.75);max-width:320px;line-height:1.45}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;color:#fff;padding:13px 22px;border-radius:14px;background:linear-gradient(135deg,#00A8E8,#7C5CFF 52%,#E6007E)}

  /* Ўрнатиш ҳақида пастки панел */
  .bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:18px;background:#fff;color:var(--k);box-shadow:0 14px 40px rgba(20,24,50,.35);max-width:520px;margin:0 auto;animation:chiq .4s ease-out}
  @keyframes chiq{from{transform:translateY(30px);opacity:0}}
  .bar img{width:46px;height:46px;border-radius:12px;flex:none}
  .bar .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.35;color:#3B4260}
  .bar .t b{display:block;font-size:15px;color:var(--k)}
  .bar .btn{padding:10px 14px;font-size:14px;border-radius:12px;flex:none}
  .bar .x{border:0;background:#F3F5FB;color:#687089;width:34px;height:34px;border-radius:10px;font-size:20px;flex:none;cursor:pointer}
  .ios-share{display:inline-block;width:16px;height:16px;vertical-align:-3px}

  /* AI офис тугмаси */
  .ai{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(84px + env(safe-area-inset-bottom));z-index:8;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;
    background:var(--k);color:#fff;font:800 13px system-ui,-apple-system,sans-serif;letter-spacing:.02em;text-decoration:none;box-shadow:0 8px 22px rgba(20,24,50,.35);opacity:.92}
  .ai::before{content:"";position:absolute;inset:-2px;border-radius:50%;padding:2px;background:var(--cmyk);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .ai:active{transform:scale(.94)}
</style>
<script src="config.js"></script>
</head>
<body>

<!-- Юкланиш экрани -->
<div id="splash" class="splash">
  <img class="logo" src="icons/logo.svg" alt="MPRINT">
  <div class="wm">MPRINT <span>CRM</span></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="msg" id="msg">Юкланмоқда...</div>
  <button class="btn hidden" id="qayta" onclick="location.reload()">Қайта уриниш</button>
</div>


<!-- AI офис (раҳбар учун, код билан) -->
<a class="ai hidden" id="aiBtn" href="ofis.html" aria-label="AI офис">AI</a>

<!-- Android: «Ўрнатиш» тугмаси -->
<div id="urnat" class="bar hidden">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>MPRINT CRM</b>Телефонга дастур қилиб ўрнатинг</div>
  <button class="btn" id="urnatBtn">Ўрнатиш</button>
  <button class="x" onclick="yop('urnat')" aria-label="Ёпиш">×</button>
</div>

<!-- iPhone: қандай ўрнатиш ҳақида йўриқнома -->
<div id="ios" class="bar hidden">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>Телефонга ўрнатиш</b>Пастдаги
    <svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>
    «Поделиться» → <b style="display:inline;font-size:13.5px">«На экран "Домой"»</b></div>
  <button class="x" onclick="yop('ios')" aria-label="Ёпиш">×</button>
</div>

<script>
  const $ = id => document.getElementById(id);
  const URL_SAYT = (window.MPRINT_URL || '').trim();
  const splash = $('splash');
  let ilova = null;
  const ornatilgan = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function xato(matn){
    $('msg').textContent = matn;
    $('dots').classList.add('hidden');
    $('qayta').classList.remove('hidden');
  }

  function och(){
    if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_SAYT)){
      xato('config.js файлига сайт ҳаволасини ёзинг (.../exec билан тугайдиган ҳавола).');
      $('qayta').classList.add('hidden');
      return;
    }
    if(!navigator.onLine){ xato('Интернет йўқ. Интернетни ёқиб, қайта уриниб кўринг.'); return; }
    const sekin = setTimeout(() => { $('msg').textContent = 'Интернет секин, бироз кутинг...'; }, 8000);
    const juda  = setTimeout(() => xato('Сайт очилмади. Интернетни текшириб, қайта уриниб кўринг.'), 45000);
    // Сайт ойнасини шу ерда яратамиз (бўш саҳифа «юкланди» деб алдамаслиги учун)
    ilova = document.createElement('iframe');
    ilova.id = 'ilova'; ilova.title = 'MPRINT CRM';
    ilova.allow = 'camera; clipboard-read; clipboard-write; fullscreen';
    ilova.addEventListener('load', () => {
      clearTimeout(sekin); clearTimeout(juda);
      ilova.classList.add('tayyor');
      splash.classList.add('ket');
      setTimeout(() => splash.classList.add('hidden'), 500);
      $('aiBtn').classList.remove('hidden');
      setTimeout(taklif, 2500);
    }, { once: true });
    ilova.src = URL_SAYT;
    document.body.insertBefore(ilova, splash);
  }

  window.addEventListener('online', () => { if(!ilova || !ilova.classList.contains('tayyor')) location.reload(); });

  /* ---------- Ўрнатиш таклифи ---------- */
  let ornatTaklifi = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ornatTaklifi = e; });
  $('urnatBtn').onclick = async () => {
    if(!ornatTaklifi) return;
    ornatTaklifi.prompt();
    try { await ornatTaklifi.userChoice; } catch(e){}
    ornatTaklifi = null; yop('urnat');
  };
  window.addEventListener('appinstalled', () => yop('urnat'));

  function yopilganmi(id){ try { return localStorage.getItem('yop_' + id) === '1'; } catch(e){ return false; } }
  function yop(id){ $(id).classList.add('hidden'); try { localStorage.setItem('yop_' + id, '1'); } catch(e){} }

  function taklif(){
    if(ornatilgan) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if(ornatTaklifi && !yopilganmi('urnat')) $('urnat').classList.remove('hidden');
    else if(ios && !yopilganmi('ios')) $('ios').classList.remove('hidden');
  }

  /* ---------- Дастур файлларини телефонда сақлаш ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  och();
</script>
</body>
</html>
